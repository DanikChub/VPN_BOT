services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped

    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}

    volumes:
      - postgres-data:/var/lib/postgresql/data

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${DB_USER} -d ${DB_NAME}"
        ]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    image: ghcr.io/${GITHUB_REPOSITORY_OWNER}/vpn-backend:${IMAGE_TAG:-latest}
    restart: unless-stopped

    environment:
      NODE_ENV: production
      PORT: 5000

      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}

      VPN_NODE_SSH_PRIVATE_KEY_PATH: /run/secrets/vpn_node_ssh_key

      CRYPTO_PAY_TOKEN: ${CRYPTO_PAY_TOKEN}
      CRYPTO_PAY_API_URL: ${CRYPTO_PAY_API_URL}
      CRYPTO_PAY_WEBHOOK_SECRET: ${CRYPTO_PAY_WEBHOOK_SECRET}

      PUBLIC_API_URL: ${PUBLIC_API_URL}
      ENABLE_TEST_PAYMENTS: ${ENABLE_TEST_PAYMENTS}

      ADMIN_JWT_SECRET: ${ADMIN_JWT_SECRET}
      ADMIN_JWT_EXPIRES_IN: ${ADMIN_JWT_EXPIRES_IN}

      SUPERADMIN_EMAIL: ${SUPERADMIN_EMAIL}
      SUPERADMIN_PASSWORD: ${SUPERADMIN_PASSWORD}

      NODE_AGENT_TOKEN: ${NODE_AGENT_TOKEN}

    volumes:
      - ./secrets/vpn_node_ssh_key:/run/secrets/vpn_node_ssh_key:ro

    depends_on:
      postgres:
        condition: service_healthy

    command:
      - sh
      - -c
      - |
        npm run db:migrate &&
        node dist/index.js

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "node -e \"fetch('http://localhost:5000/api/health').then(r => { if (!r.ok) process.exit(1) }).catch(() => process.exit(1))\""
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  telegram-bot:
    image: ghcr.io/${GITHUB_REPOSITORY_OWNER}/vpn-telegram-bot:${IMAGE_TAG:-latest}
    restart: unless-stopped

    environment:
      BOT_TOKEN: ${BOT_TOKEN}
      BACKEND_API_URL: http://backend:5000/api

    depends_on:
      backend:
        condition: service_healthy

  frontend:
    image: ghcr.io/${GITHUB_REPOSITORY_OWNER}/vpn-frontend:${IMAGE_TAG:-latest}
    restart: unless-stopped

    ports:
      - "80:80"

    depends_on:
      backend:
        condition: service_healthy

volumes:
  postgres-data: