name: Deploy production

on:
  push:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  build-and-push:
    name: Build ${{ matrix.name }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false

      matrix:
        include:
          - name: backend
            dockerfile: backend/Dockerfile
            image_name: vpn-backend

          - name: telegram-bot
            dockerfile: tg_bot/Dockerfile
            image_name: vpn-telegram-bot

          - name: frontend
            dockerfile: frontend/Dockerfile
            image_name: vpn-frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Prepare image name
        shell: bash
        run: |
          OWNER="${GITHUB_REPOSITORY_OWNER,,}"
          echo "IMAGE=ghcr.io/${OWNER}/${{ matrix.image_name }}" >> "$GITHUB_ENV"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true

          build-args: |
            ${{ matrix.name == 'frontend' && 'VITE_API_URL=/api' || '' }}

          tags: |
            ${{ env.IMAGE }}:${{ github.sha }}
            ${{ env.IMAGE }}:latest

          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}

  deploy:
    name: Deploy to server
    runs-on: ubuntu-latest
    needs:
      - build-and-push

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Copy production Compose
        uses: appleboy/scp-action@v1
        with:
          host: ${{ secrets.PRODUCTION_HOST }}
          username: ${{ secrets.PRODUCTION_USER }}
          key: ${{ secrets.PRODUCTION_SSH_KEY }}

          source: docker-compose.production.yml
          target: /opt/vpn

      - name: Deploy
        uses: appleboy/ssh-action@v1
        env:
          GHCR_USERNAME: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          IMAGE_TAG: ${{ github.sha }}

        with:
          host: ${{ secrets.PRODUCTION_HOST }}
          username: ${{ secrets.PRODUCTION_USER }}
          key: ${{ secrets.PRODUCTION_SSH_KEY }}

          envs: GHCR_USERNAME,GHCR_TOKEN,IMAGE_TAG

          script: |
            set -Eeuo pipefail

            cd /opt/vpn

            echo "$GHCR_TOKEN" |
              docker login ghcr.io \
                --username "$GHCR_USERNAME" \
                --password-stdin

            export IMAGE_TAG

            docker compose \
              --env-file .env \
              -f docker-compose.production.yml \
              pull

            docker compose \
              --env-file .env \
              -f docker-compose.production.yml \
              up -d \
              --remove-orphans

            docker compose \
              --env-file .env \
              -f docker-compose.production.yml \
              ps

            docker image prune -f