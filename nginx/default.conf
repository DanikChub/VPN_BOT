resolver 127.0.0.11 valid=10s ipv6=off;

server {
    listen 80;
    server_name admin.iordan.bar api.iordan.bar;

    return 301 https://$host$request_uri;
}


server {
    listen 443 ssl;
    server_name admin.iordan.bar;

    ssl_certificate /etc/letsencrypt/live/admin.iordan.bar/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/admin.iordan.bar/privkey.pem;

    set $frontend_upstream frontend:80;

    location / {
        proxy_pass http://$frontend_upstream;

        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}


server {
    listen 443 ssl;
    server_name api.iordan.bar;

    ssl_certificate /etc/letsencrypt/live/api.iordan.bar/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.iordan.bar/privkey.pem;

    set $backend_upstream backend:5000;

    location / {
        proxy_pass http://$backend_upstream;

        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /ws/agent {
        proxy_pass http://$backend_upstream;

        proxy_http_version 1.1;

        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_read_timeout 75s;
        proxy_send_timeout 75s;
    }
}